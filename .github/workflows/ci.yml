name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build, test & format
    # Own pushes and same-repo PRs run on the self-hosted Raspberry Pi runner.
    # Fork PRs run on GitHub-hosted runners so untrusted code never reaches the Pi.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "raspberry-pi"]') || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v6
        env:
          # Install into the runner's tool cache: no sudo needed on the Pi, and the SDK is reused between runs.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TenderScout.slnx

      - name: Build
        run: dotnet build TenderScout.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --solution TenderScout.slnx --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format TenderScout.slnx --verify-no-changes --no-restore --verbosity diagnostic
