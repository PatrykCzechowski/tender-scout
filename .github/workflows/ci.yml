name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build, test & format
    # Own pushes and same-repo PRs run on the self-hosted Raspberry Pi runner.
    # Fork PRs run on GitHub-hosted runners so untrusted code never reaches the Pi.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "raspberry-pi"]') || 'ubuntu-latest' }}
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v6
        env:
          # Install into the runner's tool cache: no sudo needed on the Pi, and the SDK is reused between runs.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TenderScout.slnx

      - name: Build
        run: dotnet build TenderScout.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        # Temporary (#52): the full test command 20 times in a row on the same binaries, with the duration of every
        # test of the document consumer class. A later commit restores the single run.
        run: |
          failed=0
          for i in $(seq 1 20); do
            start=$(date +%s)
            if dotnet test --solution TenderScout.slnx --configuration Release --no-build -- --report-xunit-trx --results-directory "$RUNNER_TEMP/run-$i" > "$RUNNER_TEMP/run-$i.log" 2>&1; then
              echo "run $i: passed in $(( $(date +%s) - start )) s"
            else
              failed=$((failed + 1))
              echo "run $i: FAILED in $(( $(date +%s) - start )) s"
              sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/run-$i.log" | grep -E -A6 '^ *failed ' | head -80
            fi
            grep -h -o '<UnitTestResult testName="[^"]*DocumentUploadedConsumerTests[^"]*" outcome="[A-Za-z]*"[^>]*duration="[0-9:.]*"' "$RUNNER_TEMP"/run-$i/*.trx \
              | sed -E 's/.*DocumentUploadedConsumerTests\.([^"]*)" outcome="([A-Za-z]*)".*duration="([0-9:.]*)"/  \3 \2 \1/' | sort
          done
          echo "failed runs: $failed of 20"
          test "$failed" -eq 0

      - name: Verify formatting
        run: dotnet format TenderScout.slnx --verify-no-changes --no-restore --verbosity diagnostic

      - name: Verify analyzer suggestions
        run: dotnet format analyzers TenderScout.slnx --severity info --verify-no-changes --no-restore

  images:
    name: Container images
    # A GitHub-hosted runner for every pull request: it starts clean, so the Dockerfile is shown to build from
    # nothing, and it is amd64, the architecture a deployment needs. Nothing is pushed to a registry.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and check the images
        run: scripts/check-images.sh
