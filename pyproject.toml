[project]
name = "tender-scout"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Patryk Czechowski", email = "pat.cze17@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
tender-scout = "tender_scout:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
